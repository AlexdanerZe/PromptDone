 if(a==='record'){t.recordId=id;render();return;}
 if(a==='same-records'){const r=R();if(r.versionId!==t.versionId){notify('当前数据版本与所选运行不同，不能沿用清单。');return;}t.fixedIds=r.ids.slice();t.n=t.fixedIds.length;render();notify('已固定沿用 '+r.label+' 的记录清单。');return;}
 if(a==='run'||a==='retry'){startRun(a==='retry');return;}
 if(a==='cancel-run'){const r=R();r.state='cancelled';r.wall='已取消（示例）';clearInterval(timers.get(r.id));timers.delete(r.id);render();return;}
 if(a==='annotate'||a==='save-comment'||a==='translate'){const r=viewRun(),rs=rows(r)||[],row=rs.find(x=>x.id===t.recordId)||rs[0];if(!row)return;if(a==='annotate')t.annotations[annotationKey(r,row)]=id;if(a==='translate')t.translations[annotationKey(r,row)]=true;if(a==='save-comment')notify('批注已保存在当前预览。');render();return;}
 if(a==='bind-data'){S.bindData=t.dataId;S.bindVersion=t.versionId;openModal('bind-data');return;}
 if(a==='bind-save'){t.dataId=S.bindData;t.versionId=S.bindVersion;t.n=V(t.versionId).records.length;t.fixedIds=null;t.reuse=false;t.selectedIds=[];S.modal=null;render();notify('后续运行使用新绑定；历史引用不变。');return;}
 if(a==='show-bound'){S.datasetPreview=t.dataId;S.previewVersion=t.versionId;S.view='datasets';render();return;}
 if(a==='preview-dataset'){S.datasetPreview=id;S.previewVersion=D(id).versions[D(id).versions.length-1].id;render();return;}
 if(a==='use-preview'){const d=D(S.datasetPreview);t.dataId=d.id;t.versionId=S.previewVersion;t.n=V(t.versionId).records.length;t.fixedIds=null;t.reuse=false;t.selectedIds=[];S.view='workbench';render();notify('已绑定 '+d.name+'，旧运行仍保留原数据。');return;}
 if(a==='new-dataset'||a==='import-version'){S.importTarget=a==='new-dataset'?null:id;S.importName='新数据集 '+(dataSeq+1);S.importStep=1;S.skipBad=false;S.jsonColumn=true;openModal('import');return;}
 if(a==='sample-file'){S.importStep=2;render();return;}
 if(a==='import-next'){S.importStep=3;render();return;}
 if(a==='import-errors'){download('prototype-import-errors.json',json([{source_index:8,raw:'{\"raw\": \"Cotton T-shirt\"',error:'JSON 截断，不补造内容'}]),'application/json');return;}
 if(a==='import-publish'){let d=S.importTarget?D(S.importTarget):null;if(!d){if(!S.importName.trim()){notify('请输入数据集名称。');return;}dataSeq++;d={id:'d'+dataSeq,name:S.importName.trim(),versions:[]};dataBank.push(d);}const number=Math.max(0,...d.versions.map(v=>v.number))+1;const v={id:d.id+'-v'+number,number:number,records:clone(S.jsonColumn?products.slice(0,7):products)};d.versions.push(v);S.datasetPreview=d.id;S.previewVersion=v.id;S.modal=null;S.view='datasets';render();notify('已保存 '+d.name+' v'+number+'；任务绑定与旧运行未被自动覆盖。');return;}
 if(a==='save-settings'){S.settingsSaved=true;S.modal=null;render();notify('示例设置已更新，没有发送网络请求。');return;}
 if(a==='copy-context'){try{await navigator.clipboard.writeText(S.exportText);notify('已复制示例上下文。');}catch(err){$('#context-text').focus();$('#context-text').select();notify('请用系统复制快捷键复制选中文本。');}return;}
 if(a==='download-context'){download('prototype-context-bundle.md',S.exportText,'text/markdown;charset=utf-8');return;}
 if(a==='download-json'||a==='download-csv'){const r=viewRun(),nr=nodeSnapshot(r),list=(rows(r)||[]).map(row=>({record_id:row.id,input:record(r,row.id).input,expected:nr.expectedBinding?record(r,row.id).expected:null,actual_output:row.raw,status:row.status,rule:row.rule,match:row.match,human:human(r,row),note:comment(r,row),cost:row.cost,tokens:row.tokens}));if(a==='download-json')download('prototype-run-detail.json',json({task:t.name,run:r.label,dataset:r.versionId,node:nr.key,records:list}),'application/json');else{const keys=['record_id','input','expected','actual_output','status','rule','match','human','note','cost','tokens'];const cell=v=>'"'+String(v==null?'':typeof v==='object'?json(v):v).replace(/"/g,'""')+'"';download('prototype-run-detail.csv','\ufeff'+[keys.join(',')].concat(list.map(row=>keys.map(k=>cell(row[k])).join(','))).join('\n'),'text/csv;charset=utf-8');}return;}
 if(a==='report'){const r=viewRun();download('prototype-report.md','# PromptDone 对比报告（示例）\n\n任务：'+t.name+'\nA：'+t.compareA+'\nB：'+t.compareB+'\n当前步骤：'+n.key+'\n\n'+json({stats:stats(r),rows:rows(r)})+'\n\n以上为示例，未执行真实模型测试。','text/markdown;charset=utf-8');return;}
});
document.addEventListener('input',e=>{
 const f=e.target.dataset.uiField;if(!f)return;const t=T(),n=N(),v=e.target.value;
 if(f==='taskQuery'){S.taskQuery=v;$('#task-items').innerHTML=taskItems();return;}
 if(f==='historyQuery'){t.historyQuery=v;$('#history-table-holder').innerHTML=historyTable(false);return;}
 if(['newTaskName','newNodeName','importName'].includes(f)){S[f]=v;return;}
 if(f==='comment'){const r=viewRun(),rs=rows(r)||[],row=rs.find(x=>x.id===t.recordId)||rs[0];if(row)t.comments[annotationKey(r,row)]=v;syncState();return;}
 if(['draft','required','temperature','maxTokens'].includes(f)){n[f]=v;n.dirty=true;const el=$('#draft-indicator');if(el)el.textContent='草稿已修改';syncState();return;}
 if(f==='n'){t.n=v;t.fixedIds=null;syncState();}
});
document.addEventListener('change',e=>{
 const el=e.target,t=T(),n=N(),f=el.dataset.uiField,v=el.value;
 if(el.dataset.uiRecord){const id=el.dataset.uiRecord;t.selectedIds=el.checked?Array.from(new Set(t.selectedIds.concat(id))):t.selectedIds.filter(x=>x!==id);render();return;}
 if(!f)return;
 if(['draft','required','temperature','maxTokens','n','taskQuery','historyQuery','newTaskName','newNodeName','importName','comment'].includes(f))return;
 if(f==='jsonColumn'||f==='skipBad')S[f]=el.checked;
 else if(f==='reuse')t.reuse=el.checked;
 else if(f==='bindData'){S.bindData=v;S.bindVersion=D(v).versions[D(v).versions.length-1].id;}
 else if(f==='bindVersion'||f==='previewVersion')S[f]=v;
 else if(['mode','baseline','compareA','compareB','filter'].includes(f)){t[f]=v;if(f==='mode')t.fixedIds=null;}
 else if(f==='expectedBinding'){n.expectedBinding=v==='true';n.dirty=true;}
 else if(['model','source','format'].includes(f)){n[f]=v;n.dirty=true;}
 render();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.modal){closeModal();return;}
 if(e.key==='Tab'&&S.modal){const fs=Array.from(document.querySelectorAll('.dialog input,.dialog textarea,.dialog select,.dialog button:not(:disabled)')).filter(x=>x.offsetParent!==null),first=fs[0],last=fs[fs.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
render();

</script>
</body>
