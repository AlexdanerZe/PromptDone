<body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const json = x => JSON.stringify(x,null,2);
const variants={A:{name:'资产导航',desc:'数据、工作台、对比独立入口。共享资产清楚，跨页面切换较多。'},B:{name:'任务聚合',desc:'任务列表 → 任务详情；数据、调优、对比收在任务内。推荐先从这里体验。'},C:{name:'数据表优先',desc:'数据表是主操作面，右侧配置 Prompt；适合逐条检视，信息密度更高。'}};
const items=[
 {id:'pd001',name:'Desk lamp',expected:'lighting',a:'home',b:'lighting',ha:'坏',hb:'好',cost:.0038,tokens:612,latency:2.8},
 {id:'pd002',name:'USB-C cable',expected:'electronics',a:'electronics',b:'electronics',ha:'好',hb:'好',cost:.0024,tokens:403,latency:2.1},
 {id:'pd003',name:'Steel travel mug',expected:'drinkware',a:'drinkware',b:'home',ha:'好',hb:'坏',cost:.0028,tokens:461,latency:2.6},
 {id:'pd004',name:'Outdoor camping chair',expected:'outdoor',a:'home',b:'outdoor',ha:'坏',hb:'好',cost:.0042,tokens:721,latency:3.4},
 {id:'pd005',name:'Ceramic bowl',expected:'kitchen',a:'kitchen',b:null,ha:'好',hb:'坏',cost:.0019,tokens:354,latency:1.9},
 {id:'pd006',name:'Bath towel',expected:'bath',a:null,b:'bath',ha:'未评价',hb:'好',cost:null,tokens:null,latency:3.1},
 {id:'pd007',name:'Unknown SKU 78',expected:null,a:'unknown',b:'unknown',ha:'未评价',hb:'未评价',cost:.0026,tokens:425,latency:2.4},
 {id:'pd008',name:'Cotton T-shirt',expected:'apparel',a:'apparel',b:undefined,ha:'好',hb:'未评价',cost:0,tokens:0,latency:0}
];
const p1='Extract product information from {{raw}}.\nReturn JSON with name and category_hint.\nDo not invent missing information.';
const pa='Classify {{product.name}}.\nReturn JSON with category only.\nUse broad categories when unsure.';
const pb='Classify {{product.name}}.\nReturn JSON with category only.\nUse the most specific supported category.\nKeep drinkware separate from home.';
const promptVersions=[{version:1,prompt:pa},{version:2,prompt:pb}];
const datasets=[{version:1,count:8}];
const S={variant:(new URLSearchParams(location.search).get('variant')||'B').toUpperCase(),section:'run',runId:'B',compareA:'A',compareB:'B',recordId:'pd003',node:2,dataVersion:1,publishedData2:false,draft:pb,draftDirty:false,promptVersion:2,mode:'first',n:8,fixedIds:null,reuse:false,baseline:'A',filter:'all',selected:[],annotations:{},notes:{},translated:{},modal:null,importStep:1,jsonColumn:true,skipBad:false,importReady:false,model:'task-default',translationModel:'translate-default',temperature:'0',maxTokens:'2048',settingsSaved:false,exportText:'',progress:0,taskName:'商品字段清洗与分类'};
if(!variants[S.variant])S.variant='B';
const clone=x=>JSON.parse(JSON.stringify(x));
function result(item,kind,reuse){
 let category=kind==='A'?item.a:item.b;
 if(reuse && item.id==='pd008')category='apparel';
 let status=category===undefined?'skipped':category===null?(kind==='A'?'failed':'schema_failed'):'success';
 let raw=category===undefined?'':category===null?(kind==='A'?'':json({label:'kitchen'})):json({category:category});
 return {id:item.id,status:status,raw:raw,category:category,rule:raw?(category!==null):null,match:raw&&item.expected!==null?category===item.expected:null,human:kind==='A'?item.ha:item.hb,cost:kind==='A'?(category===null?null:.003):item.cost,tokens:kind==='A'?(category===null?null:500):item.tokens,latency:kind==='A'?3.2:item.latency};
}
const runs=[
 {id:'A',name:'运行 A',version:1,dataVersion:1,prompt:pa,model:'task-default',temperature:'0',maxTokens:'2048',ids:items.map(x=>x.id),rows:items.map(x=>result(x,'A',false)),state:'completed',wall:'45.6 秒',reused:false},
 {id:'B',name:'运行 B',version:2,dataVersion:1,prompt:pb,model:'task-default',temperature:'0',maxTokens:'2048',ids:items.map(x=>x.id),rows:items.map(x=>result(x,'B',false)),state:'completed',wall:'42.8 秒',reused:false}
];
let runTimer=null,toastTimer=null,focusBeforeModal=null;
const byId=id=>items.find(x=>x.id===id);
const currentRun=()=>runs.find(x=>x.id===S.runId)||runs[0];
const dataItems=()=>items.slice(0,(datasets.find(d=>d.version===S.dataVersion)||datasets[0]).count);
const selectedRow=()=>currentRun().rows.find(x=>x.id===S.recordId)||currentRun().rows[0];
const human=(run,row)=>S.annotations[run.id+':'+row.id]||row.human;
const note=(run,row)=>S.notes[run.id+':'+row.id]||((row.id==='pd003'&&run.id!=='A')?'杯具被归入 home，需保留更具体的 drinkware。':'');
const pct=(a,b)=>b?(100*a/b).toFixed(1)+'%':'—';
const chip=(text,type)=>'<span class="pill '+(type||'neutral')+'">'+esc(text)+'</span>';
const btn=(label,action,extra,attrs)=>'<button type="button" class="btn '+(extra||'')+'" data-action="'+action+'" '+(attrs||'')+'>'+label+'</button>';
function notify(t){const el=$('#toast');el.className='toast';el.textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.className='';el.textContent='';},3800);}
function stateText(){return json({方案:S.variant,任务:S.taskName,页面:S.section,数据版本:'v'+S.dataVersion,版本目录:datasets,当前节点:S.node,当前运行:S.runId,草稿已修改:S.draftDirty,当前发布版本:S.promptVersion,运行方式:S.mode,固定记录:S.fixedIds,复用基准:S.reuse?S.baseline:null,选中记录:S.selected,打开面板:S.modal,人工标记:S.annotations,运行:runs.map(x=>({id:x.id,数据版本:x.dataVersion,状态:x.state,记录清单:x.ids,复用上游:x.reused}))});}
function syncState(){const el=$('#state-json');if(el)el.textContent=stateText();}
function showModal(kind){const el=document.activeElement;focusBeforeModal=el&&el.dataset?{action:el.dataset.action,value:el.dataset.value}:null;S.modal=kind;render();setTimeout(()=>{const t=$('.dialog button')||$('.dialog textarea');if(t)t.focus();},0);}
function closeModal(){S.modal=null;render();if(focusBeforeModal&&focusBeforeModal.action){const el=$('[data-action="'+focusBeforeModal.action+'"]'+(focusBeforeModal.value?'[data-value="'+focusBeforeModal.value+'"]':''));if(el)el.focus();}}
function setVariant(v){S.variant=v;try{const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);}catch(e){}render();}
function status(row){const m={success:['成功','ok'],failed:['调用超时','bad'],schema_failed:['字段缺失','bad'],skipped:['上游失败，已跳过','warn'],pending:['等待执行','neutral']};return chip.apply(null,m[row.status]||['未知','neutral']);}
function cost(row){if(row.status==='skipped'||row.status==='pending')return '未调用';return row.cost==null?'未知':'$'+row.cost.toFixed(4);}
function snapshotInput(item){return json({name:item.name,category_hint:'from step_1.output'});}
function header(title,subtitle){return '<div class="header"><div><h1>'+esc(title)+'</h1><div class="small muted">'+esc(subtitle)+'</div></div><div class="inline">'+btn('任务列表','task-list','ghost')+btn('导入数据','import')+btn('设置','settings','ghost')+'</div></div>';}
function nav(){return '<div class="nav">'+[['data','数据'],['run','调优'],['compare','对比']].map(x=>'<button data-action="nav" data-value="'+x[0]+'" class="'+(S.section===x[0]?'active':'')+'" aria-current="'+(S.section===x[0]?'page':'false')+'">'+x[1]+'</button>').join('')+'</div>';}
function steps(){return '<div class="steps">'+[1,2].map(n=>'<button class="step '+(S.node===n?'active':'')+'" data-action="node" data-value="'+n+'"><span class="number">'+n+'</span><span>'+['','清洗抽取','品类分类'][n]+'</span>'+chip(n===1?'v1 已锁定':'草稿 / v'+S.promptVersion,n===1?'neutral':'info')+'</button>').join('<span class="muted" aria-hidden="true">→</span>')+'</div>';}
function editor(compact){
 const first=S.node===1;

function runControls(){

function historyView(){
 return '<div class="section-head"><h2>运行历史</h2><span class="small muted">点选历史查看当时的冻结结果</span></div><div class="history">'+runs.map(r=>'<button class="run-card '+(r.id===S.runId?'selected':'')+'" data-action="run-select" data-value="'+r.id+'">'+esc(r.name)+' · '+(r.state==='running'?'运行中':r.state==='cancelled'?'已取消':'已完成')+'<span>数据 v'+r.dataVersion+' · Prompt v'+r.version+' · '+r.ids.length+' 条</span></button>').join('')+'</div>';

function metricView(run){
 const checked=run.rows.filter(x=>x.rule!==null&&x.status!=='pending'),passed=checked.filter(x=>x.rule),matched=run.rows.filter(x=>x.match!==null&&x.status!=='pending'),matchPass=matched.filter(x=>x.match),rated=run.rows.filter(x=>human(run,x)!=='未评价'&&x.status!=='pending'),good=rated.filter(x=>human(run,x)==='好');
 return '<div class="metrics">'+[
 ['规则通过率',pct(passed.length,checked.length),passed.length+' / '+checked.length+' 已检查'],
 ['答案匹配率',pct(matchPass.length,matched.length),matchPass.length+' / '+matched.length+' 有答案且已比对'],
 ['人工好评率',pct(good.length,rated.length),good.length+' 好评 · 已评 '+rated.length+' / '+run.ids.length],
 ['本节点调用费用','$'+run.rows.filter(x=>x.status!=='pending'&&x.cost!=null).reduce((a,x)=>a+x.cost,0).toFixed(4),'已知小计 · '+run.rows.filter(x=>x.cost==null&&x.status!=='pending').length+' 条未知']
 ].map(x=>'<div class="metric"><span class="small muted">'+x[0]+'</span><b>'+x[1]+'</b><small>'+x[2]+'</small></div>').join('')+'</div>';
}
function resultTable(){
 const run=currentRun();let rows=run.rows;
 if(S.filter==='bad')rows=rows.filter(x=>human(run,x)==='坏'||x.status==='failed'||x.status==='schema_failed');

}

}

function dataView(){

function comparisonMetrics(a,b){
 function rate(r,type){const rows=r.rows.filter(x=>type==='human'?human(r,x)!=='未评价':x[type]!==null);return pct(rows.filter(x=>type==='human'?human(r,x)==='好':x[type]===true).length,rows.length);}
 function sum(r){return '$'+r.rows.filter(x=>x.cost!=null).reduce((t,x)=>t+x.cost,0).toFixed(4);}
 return '<div class="metrics">'+[['规则通过率',rate(a,'rule')+' → '+rate(b,'rule')],['答案匹配率',rate(a,'match')+' → '+rate(b,'match')],['人工好评率',rate(a,'human')+' → '+rate(b,'human')],['本节点费用（已知小计）',sum(a)+' → '+sum(b)]].map(x=>'<div class="metric"><span class="small muted">'+x[0]+'</span><b style="font-size:15px">'+x[1]+'</b><small>未知与未覆盖项另列，非综合评分</small></div>').join('')+'</div>';
}
function compareView(compact){
 const a=runs.find(x=>x.id===S.compareA)||runs[0],b=runs.find(x=>x.id===S.compareB)||runs[1],same=a.dataVersion===b.dataVersion&&json(a.ids.slice().sort())===json(b.ids.slice().sort()),pairs=a.rows.map(x=>({a:x,b:b.rows.find(y=>y.id===x.id)})).filter(x=>x.b);
 function changes(p){return [p.a.rule===true&&p.b.rule===false?'规则退化':'',p.a.match===true&&p.b.match===false?'答案退化':'',human(a,p.a)==='好'&&human(b,p.b)==='坏'?'人工退化':'',p.a.status==='success'&&['failed','skipped','schema_failed'].includes(p.b.status)?'执行退化':''].filter(Boolean);}
 pairs.sort((x,y)=>changes(y).length-changes(x).length);
 const selected=pairs.find(x=>x.a.id===S.recordId)||pairs[0],reg=pairs.filter(p=>changes(p).length).length;
 return '<div class="body"><div class="section-head"><div><h1>同批数据版本对比</h1><p class="small muted">按记录 ID 对齐；规则、标准答案和人工评价分别比较。</p></div><div class="inline">'+btn('下载汇总报告','report','primary')+btn('导出选中坏例','export','',S.selected.length?'':'disabled')+'</div></div><div class="field-grid"><label>基准运行 A<select data-field="compareA">'+runs.map(r=>'<option value="'+r.id+'" '+(r.id===a.id?'selected':'')+'>'+r.name+' · Prompt v'+r.version+' · 数据 v'+r.dataVersion+'</option>').join('')+'</select></label><label>对比运行 B<select data-field="compareB">'+runs.map(r=>'<option value="'+r.id+'" '+(r.id===b.id?'selected':'')+'>'+r.name+' · Prompt v'+r.version+' · 数据 v'+r.dataVersion+'</option>').join('')+'</select></label></div>'+(!same?'<div class="banner">数据版本或记录清单不同，不能直接生成同批对比。请沿用基准记录清单重新运行。</div>':'<div class="banner"><strong>'+pairs.length+' 条已对齐 · '+reg+' 条存在退化</strong>　'+chip('未评价不算坏评','neutral')+'　耗时：'+a.wall+' → '+b.wall+'</div>'+comparisonMetrics(a,b)+'<div class="grid2" style="margin-top:12px"><div class="result-block line-old"><div class="result-caption">基准 '+a.id+' · '+esc(a.model)+' · Prompt v'+a.version+'</div><pre>'+esc(a.prompt)+'</pre></div><div class="result-block line-new"><div class="result-caption">新版 '+b.id+' · '+esc(b.model)+' · Prompt v'+b.version+'</div><pre>'+esc(b.prompt)+'</pre></div></div><div class="panel" style="margin-top:14px"><div class="panel-head"><h2>逐条对照 · 退化置顶</h2><span class="small muted">缺失 usage 或价格显示未知，复用费用单列</span></div><div class="table-scroll"><table><thead><tr><th>选择</th><th>记录</th><th>输入</th><th>变化</th><th>A 人工</th><th>B 人工</th></tr></thead><tbody>'+pairs.map(p=>'<tr class="'+(p.a.id===S.recordId?'selected':changes(p).length?'regression':'')+'"><td><input type="checkbox" data-record="'+p.a.id+'" aria-label="选择 '+p.a.id+'" '+(S.selected.includes(p.a.id)?'checked':'')+'></td><td>'+btn(p.a.id,'record','link','data-value="'+p.a.id+'"')+'</td><td>'+esc(byId(p.a.id).name)+'</td><td>'+(changes(p).length?changes(p).map(c=>chip(c,'bad')).join(' '):chip(p.a.match===false&&p.b.match===true?'答案改善':'无已确认退化','neutral'))+'</td><td>'+esc(human(a,p.a))+'</td><td>'+esc(human(b,p.b))+'</td></tr>').join('')+'</tbody></table></div></div>'+(selected?'<div class="grid2" style="margin-top:14px"><div class="panel"><div class="panel-head"><h2>'+selected.a.id+' · 基准输出</h2>'+status(selected.a)+'</div><div class="panel-body"><pre>'+esc(selected.a.raw||'无输出')+'</pre></div></div><div class="panel"><div class="panel-head"><h2>'+selected.b.id+' · 新版输出</h2>'+status(selected.b)+'</div><div class="panel-body"><pre>'+esc(selected.b.raw||'无输出')+'</pre></div></div></div>':''))+'</div>';
}

 let body='<div class="version-list">'+[1,2,3].map((n)=>btn(n+' '+['','选择文件','映射与预览','清洗确认'][n],'import-step','tiny '+(step===n?'active':''),'data-value="'+n+'"')).join('')+'</div>';
 if(step===1)body+='<div class="dropzone" style="margin-top:18px"><strong>Excel / CSV / JSON</strong><p>单文件 ≤20 MB，少于 50,000 条记录</p>'+btn('使用含偏 JSON 的示例文件','sample-file','primary')+'<p>原型只加载内置示例，不上传真实文件。</p></div>';
 if(step===2)body+='<div class="banner" style="margin-top:16px">示例文件：商品导出-含偏JSON.csv · 8 条记录</div><div class="field-grid" style="margin-top:14px"><label>payload 列角色<select><option>Input 变量 raw</option><option>忽略</option></select></label><label>expected 列角色<select><option>Expected Output（可选）</option><option>忽略</option></select></label></div><label class="check"><input type="checkbox" data-field="jsonColumn" '+(S.jsonColumn?'checked':'')+'>将 payload 明确指定为 JSON，尝试常见格式修复</label><div class="result-block" style="margin-top:12px"><div class="result-caption">预览 · 第 1 条</div><pre>'+esc('原文：\x60\x60\x60json\\n{"raw":"Desk lamp"}\\n\x60\x60\x60\n处理：'+(S.jsonColumn?'去除代码围栏，解析为 JSON':'按普通文本保留，不自动修复'))+'</pre></div><p class="hint">复杂嵌套路径提取后置；不会猜测缺失字段或补造截断数据。</p>';
 if(step===3)body+='<div class="inline" style="margin-top:16px">'+chip('原文件 8 条','neutral')+chip((S.jsonColumn?'6 直接通过 · 1 修复':'8 按文本保留'),'ok')+(S.jsonColumn?chip('1 条失败','bad'):'')+'</div><div class="grid2" style="margin-top:12px"><div class="result-block"><div class="result-caption">修复记录 · 原文</div><pre>'+esc('\x60\x60\x60json\n{"raw":"Desk lamp"}\n\x60\x60\x60')+'</pre></div><div class="result-block"><div class="result-caption">修复后</div><pre>'+esc(S.jsonColumn?'{"raw":"Desk lamp"}':'按文本保留，无自动修复')+'</pre></div></div>'+(S.jsonColumn?'<div class="result-block"><div class="result-caption">第 8 条 · 失败原因：JSON 截断，不补造内容</div><pre>'+esc('{"raw": "Cotton T-shirt"')+'</pre></div><div class="inline between" style="margin-top:12px"><label class="check"><input type="checkbox" data-field="skipBad" '+(S.skipBad?'checked':'')+'>排除这 1 条失败记录，保存其余 7 条</label>'+btn('导出失败记录','export-import-error','tiny')+'</div>':'')+'<p class="hint">保存会生成新版本；运行 A/B 仍绑定原 v1。此处结果为内置演示。</p>';
 return '<div class="dialog-body">'+body+'</div><div class="dialog-footer"><span class="small muted">第 '+step+' / 3 步</span><div class="inline">'+btn('取消','close')+(step<3?btn('下一步','import-next','primary'):btn('保存为新版本','import-publish','primary',S.jsonColumn&&!S.skipBad?'disabled':''))+'</div></div>';
}
function contextText(){
 const r=currentRun(),ids=S.selected.length?S.selected:[S.recordId],records=r.rows.filter(x=>ids.includes(x.id)).map(x=>({record_id:x.id,input:{raw:byId(x.id).name},expected_output:byId(x.id).expected===null?null:{category:byId(x.id).expected},actual_output:x.raw||null,status:x.status,human_verdict:human(r,x),note:note(r,x)}));
 return '# PromptDone Context Bundle（示例）\n\n任务：'+S.taskName+'\n运行：'+r.id+'；数据版本：v'+r.dataVersion+'；节点：step_2\n模型别名：'+r.model+'；temperature：'+r.temperature+'\n\n## Prompt\n\n'+r.prompt+'\n\n## 问题记录\n\n'+json(records)+'\n\n## 请求\n\n请分析失败原因并提出 Prompt 修改建议；修改后仍需用相同数据清单验证。\n本包只包含显式选择的诊断字段，不包含网关密钥或其他系统凭证。';
}
function modalView(){
 if(!S.modal)return '';
 const kind=S.modal,title={import:'导入数据 · 新建不可变版本',settings:'模型与访问设置',versions:'Prompt 发布版本',export:'导出问题上下文',newtask:'新建调优任务'}[kind]||'详情';
 let content='';
 if(kind==='import')content=importDialog();
 if(kind==='settings')content='<div class="dialog-body"><div class="banner">示例连接 · 本原型不会请求 LiteLLM 或保存真实密钥</div><div class="field-grid" style="margin-top:14px"><label>LiteLLM 服务地址<input value="http://litellm:4000/v1"></label><label>网关访问密钥<input type="password" placeholder="已配置 · 仅显示掩码" autocomplete="off"></label><label>默认运行模型别名<select data-field="model"><option>task-default</option><option>quality-large</option></select></label><label>辅助翻译模型别名<select data-field="translationModel"><option>translate-default</option><option>quality-large</option></select></label><label>输入单价 / 每百万 Token<input placeholder="可选；缺失时费用显示未知"></label><label>输出单价 / 每百万 Token<input placeholder="可选；缺失时费用显示未知"></label></div><p class="small muted">模型别名在 LiteLLM 配置；厂商凭证由网关管理。共享访问口令通过部署配置设置，页面/API 使用同一会话。</p></div><div class="dialog-footer"><span class="small muted">四服务：前端 / 后端 / LiteLLM / PostgreSQL</span><div class="inline">'+btn('取消','close')+btn('保存示例设置','save-settings','primary')+'</div></div>';
 if(kind==='versions')content='<div class="dialog-body"><div class="banner">发布版本不可变；运行快照可来自尚未发布的草稿。</div>'+promptVersions.map((pv)=>'<div class="result-block"><div class="inline between"><strong>v'+pv.version+'</strong>'+btn('复制到当前草稿','restore-draft','tiny','data-value="'+pv.version+'"')+'</div><pre>'+esc(pv.prompt)+'</pre></div>').join('')+'</div><div class="dialog-footer"><span class="small muted">恢复只改草稿，不修改历史运行。</span>'+btn('关闭','close')+'</div>';
 if(kind==='export'){S.exportText=contextText();content='<div class="dialog-body"><p class="small muted">选中 '+(S.selected.length||1)+' 条记录；包含实际 Prompt、输入输出和批注，不包含系统凭证。</p><textarea class="export-box" id="context-text" readonly>'+esc(S.exportText)+'</textarea><p class="hint">复制受浏览器限制时可直接选择文本；下载为本地 Markdown。</p></div><div class="dialog-footer"><span class="small muted">由你交给 Codex / Antigravity</span><div class="inline">'+btn('关闭','close')+btn('下载 Markdown','download-context')+btn('复制文本','copy-context','primary')+'</div></div>';}
 if(kind==='newtask')content='<div class="dialog-body"><label>任务名称<input id="task-name" value="新的 Prompt 调优任务"></label><p class="small muted">原型将使用内置数据展示新任务详情，不创建真实资产。</p></div><div class="dialog-footer">'+btn('取消','close')+btn('创建示例任务','create-task','primary')+'</div>';
 return '<div class="overlay" data-action="backdrop"><section class="dialog '+(kind==='import'?'wide':'')+'" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-header"><h2 id="dialog-title">'+title+'</h2>'+btn('关闭','close','ghost small')+'</div>'+content+'</section></div>';
}
function render(){
 const v=variants[S.variant];
 $('#app').innerHTML='<div class="mockup"><div class="review-note"><div><strong>页面结构原型 · '+S.variant+' / '+v.name+'</strong><p>'+v.desc+'</p></div><div class="inline"><span class="review-tag">示例数据 · 仅内存 · 不调用模型</span>'+['A','B','C'].map(k=>btn(k+' '+variants[k].name,'variant','tiny '+(S.variant===k?'active':''),'data-value="'+k+'"')).join('')+'</div></div>'+({A:variantA,B:variantB,C:variantC}[S.variant]())+'<details class="prototype-state"><summary>查看原型当前状态（刷新会重置）</summary><pre id="state-json">'+esc(stateText())+'</pre></details>'+modalView()+'</div><div class="switcher" aria-label="页面方案切换"><button data-action="prev-variant" aria-label="上一个方案">←</button><div class="variant-name" aria-live="polite">'+S.variant+' · '+v.name+'<div class="variant-count">结构方案 '+(['A','B','C'].indexOf(S.variant)+1)+' / 3</div></div><button data-action="next-variant" aria-label="下一个方案">→</button><div class="variant-shortcuts">'+['A','B','C'].map(k=>'<button data-action="variant" data-value="'+k+'" aria-pressed="'+(S.variant===k)+'">'+k+'</button>').join('')+'</div></div>';
}
function saveDownload(name,text,type){const u=URL.createObjectURL(new Blob([text],{type:type||'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function reportText(){const a=runs.find(x=>x.id===S.compareA),b=runs.find(x=>x.id===S.compareB);return '# PromptDone 对比报告（原型示例）\n\n任务：'+S.taskName+'\n基准：'+a.id+'；对比：'+b.id+'\n数据版本：'+a.dataVersion+' / '+b.dataVersion+'\n记录清单：'+a.ids.join(', ')+'\n\n## 配置变化\n\n基准 Prompt：\n'+a.prompt+'\n\n新版 Prompt：\n'+b.prompt+'\n\n## 指标与边界\n\n规则、答案匹配与人工评价分开统计，未评价不算坏评。\n总耗时：'+a.wall+' → '+b.wall+'\nToken/费用缺失标记未知；复用不重复计入本次调用费用；辅助翻译费用单列。\n\n## 逐条记录\n\n'+json(b.rows.map(x=>({id:x.id,status:x.status,rule:x.rule,match:x.match,human:human(b,x),cost:x.cost,tokens:x.tokens})))+'\n\n所有内容为示例，未执行真实模型测试。';}
function beginRun(retry){
 const old=currentRun();let ids;
 if(retry){ids=old.rows.filter(x=>['failed','schema_failed','skipped','pending'].includes(x.status)).map(x=>x.id);if(!ids.length){notify('当前运行没有失败或未完成记录。');return;}S.dataVersion=old.dataVersion;}
 else if(S.fixedIds)ids=S.fixedIds.slice();
 else if(S.mode==='single')ids=[dataItems().some(x=>x.id===S.recordId)?S.recordId:dataItems()[0].id];
 else{const list=dataItems().map(x=>x.id);if(S.mode==='random')for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]];}ids=list.slice(0,Number(S.n));}
 if(!ids.length){notify('请先选择数据记录。');return;}
 const id=String.fromCharCode(65+runs.length),snapshot={id:id,name:'运行 '+id,version:S.promptVersion,dataVersion:S.dataVersion,prompt:S.draft,model:S.model,temperature:S.temperature,maxTokens:S.maxTokens,ids:ids.slice(),state:'running',wall:'示例进行中',reused:S.reuse,baseline:S.baseline};
 snapshot.rows=ids.map(id=>({id:id,status:'pending',raw:'',rule:null,match:null,human:'未评价',cost:null,tokens:null,latency:0}));runs.push(snapshot);S.runId=id;S.recordId=ids[0];S.progress=0;S.section='run';render();clearInterval(runTimer);
 runTimer=setInterval(()=>{if(snapshot.state!=='running'){clearInterval(runTimer);return;}const item=byId(ids[S.progress]);snapshot.rows[S.progress]=result(item,'B',snapshot.reused);S.progress++;if(S.progress===ids.length){snapshot.state='completed';snapshot.wall=(ids.length*1.4).toFixed(1)+' 秒（示例）';clearInterval(runTimer);notify('示例运行完成；配置与记录清单已冻结在本次预览中。');}render();},420);
}
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,v=el.dataset.value;if(el.disabled)return;
 if(a==='backdrop'){if(e.target===el)closeModal();return;}
 if(a==='variant')return setVariant(v);
 if(a==='next-variant'||a==='prev-variant'){const n=['A','B','C'].indexOf(S.variant);return setVariant(['A','B','C'][(n+(a==='next-variant'?1:2))%3]);}
 if(a==='nav'){S.section=v;S.selected=[];render();return;}
 if(a==='task-list'){S.section='list';render();return;}
 if(a==='open-task'){S.section='run';render();return;}
 if(a==='settings'||a==='versions'||a==='export'){showModal(a);return;}
 if(a==='new-task'){showModal('newtask');return;}
 if(a==='create-task'){S.taskName=$('#task-name').value.trim()||'新的调优任务';S.section='data';S.modal=null;render();notify('已创建内存中的示例任务。');return;}
 if(a==='close'){closeModal();return;}
 if(a==='import'){S.importStep=1;S.skipBad=false;S.importReady=false;showModal('import');return;}
 if(a==='sample-file'){S.importReady=true;S.importStep=2;render();return;}
 if(a==='import-step'){S.importStep=Number(v);render();return;}
 if(a==='import-next'){S.importReady=true;S.importStep++;render();return;}
 if(a==='import-publish'){const version=Math.max(...datasets.map(d=>d.version))+1;const count=S.jsonColumn?7:8;datasets.push({version:version,count:count});S.dataVersion=version;S.n=count;S.fixedIds=null;S.reuse=false;S.section='data';S.modal=null;render();notify('已保存示例 v'+S.dataVersion+'；运行 A/B 仍绑定 v1，未覆盖历史。');return;}
 if(a==='export-import-error'){saveDownload('prototype-import-errors.json',json([{source_index:8,raw:'{"raw": "Cotton T-shirt"',error:'JSON 截断，不补造内容'}]),'application/json');return;}
 if(a==='node'){S.node=Number(v);render();return;}
 if(a==='save-draft'){S.draftDirty=false;render();notify('示例草稿已保存在内存中。');return;}
 if(a==='publish'){S.promptVersion++;promptVersions.push({version:S.promptVersion,prompt:S.draft});S.draftDirty=false;render();notify('已发布示例 v'+S.promptVersion+'；历史运行保持原配置。');return;}
 if(a==='restore-draft'){S.draft=(promptVersions.find(x=>x.version===Number(v))||promptVersions[0]).prompt;S.draftDirty=true;S.modal=null;render();notify('已复制到草稿，历史版本未改变。');return;}
 if(a==='run-select'){S.runId=v;S.selected=[];S.recordId=currentRun().ids[0];render();return;}
 if(a==='same-records'){const r=currentRun();if(r.dataVersion!==S.dataVersion){notify('请先切换为基准相同的数据版本 v'+r.dataVersion+'。');return;}S.fixedIds=r.ids.slice();S.n=r.ids.length;render();notify('已固定沿用 '+r.id+' 的记录清单，不重新抽样。');return;}
 if(a==='run'||a==='retry'){beginRun(a==='retry');return;}
 if(a==='cancel-run'){currentRun().state='cancelled';currentRun().wall='已取消（示例）';clearInterval(runTimer);render();notify('已阻止示例后续记录；已完成结果保留。');return;}
 if(a==='record'){S.recordId=v;render();return;}
 if(a==='annotate'){const r=currentRun(),row=selectedRow();S.annotations[r.id+':'+row.id]=v;render();return;}
 if(a==='save-note'){const r=currentRun(),row=selectedRow();S.notes[r.id+':'+row.id]=$('[data-field=annotation]').value;syncState();notify('批注已保存在本次预览中。');return;}
 if(a==='translate'){S.translated[currentRun().id+':'+S.recordId]=true;render();notify('已展开内置中文译文示例，没有调用模型。');return;}
 if(a==='go-compare'){S.compareB=S.runId;S.compareA='A';S.section='compare';render();return;}
 if(a==='save-settings'){S.settingsSaved=true;S.modal=null;render();notify('示例设置已更新；未发送任何网关请求。');return;}
 if(a==='download-context'){saveDownload('prototype-context-bundle.md',S.exportText,'text/markdown;charset=utf-8');return;}
 if(a==='copy-context'){try{await navigator.clipboard.writeText(S.exportText);notify('已复制示例上下文包。');}catch(err){$('#context-text').focus();$('#context-text').select();notify('请用系统复制快捷键复制已选文本。');}return;}
 if(a==='report'){saveDownload('prototype-comparison-report.md',reportText(),'text/markdown;charset=utf-8');return;}
 if(a==='download-detail'){const r=currentRun();saveDownload('prototype-run-'+r.id+'.json',json({run:r.id,data_version:r.dataVersion,record_ids:r.ids,rows:r.rows.map(x=>Object.assign({},x,{human:human(r,x),note:note(r,x)}))}),'application/json');return;}
});
document.addEventListener('change',e=>{
 const t=e.target,f=t.dataset.field;
 if(t.dataset.record){const id=t.dataset.record;S.selected=t.checked?Array.from(new Set(S.selected.concat(id))):S.selected.filter(x=>x!==id);render();return;}
 if(!f||f==='draft'||f==='annotation')return;
 if(f==='reuse')S.reuse=t.checked;
 else if(f==='jsonColumn')S.jsonColumn=t.checked;
 else if(f==='skipBad')S.skipBad=t.checked;
 else if(f==='dataVersion'){S.dataVersion=Number(t.value);S.n=dataItems().length;S.fixedIds=null;S.reuse=false;}
 else if(f==='singleRecord')S.recordId=t.value;
 else if(f==='mode'){S.mode=t.value;S.fixedIds=null;}
 else if(f==='n'){S.n=t.value;S.fixedIds=null;}
 else S[f]=t.value;
 render();
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.field==='draft'){S.draft=t.value;S.draftDirty=true;const d=$('#draft-status');if(d)d.textContent='草稿有未保存修改';syncState();}if(t.dataset.field==='annotation'){S.notes[currentRun().id+':'+S.recordId]=t.value;syncState();}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.modal){closeModal();return;}
 if(S.modal&&e.key==='Tab'){const focusable=Array.from(document.querySelectorAll('.dialog button:not(:disabled),.dialog input,.dialog select,.dialog textarea')).filter(x=>x.offsetParent!==null);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}return;}
 if(S.modal||e.target.closest('input,textarea,select,[contenteditable]'))return;
 if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const n=['A','B','C'].indexOf(S.variant);setVariant(['A','B','C'][(n+(e.key==='ArrowRight'?1:2))%3]);}
});
render();
</script>
</body>
</html>
