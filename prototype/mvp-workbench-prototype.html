<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptDone MVP V2 — 列表页→详情页统一架构高保真原型 (Interactive Demo)</title>
  <!--
    UI PROTOTYPE (THROWAWAY) — Wayfinder Issue #40 (Iteration 4)
    Aligned strictly to user's List-First + Detail-Workspace feedback:
      1. Data Tab: Uploaded Datasets List -> "+ 新增数据" Modal Wizard (with Batch Field Mapping & Batch Draft Repair) -> Dataset Detail with Re-clean/Config Change generating a new immutable Dataset Version.
      2. Workbench Tab: Workflow Tasks List -> Workflow Detail with:
           - Top: Horizontal Linear Step Bar (click to switch / add / reorder steps)
           - Left: Selected Step's Prompt Editor, Version Binding & Model Switcher
           - Top-Right: Run History List (Batch ID, Timestamp, Prompt/Model Version, Mode, Pass Rate)
           - Bottom-Right: Selected Batch's Multi-Record List & Sample Detail (Rendered Request, Formatted JSON, Targeted ZH Translation, Annotation)
      3. Compare Tab: Comparison Tasks List (across different tuning needs/workflows) + "+ 新建对比" Modal -> Compare Detail (Config Diff + Metrics + Side-by-Side Output Diff).
      4. Settings Tab: Model Provider List + Add/Edit Drawer + Security/Redaction Config.
  -->
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --surface-3: #f1f5f9;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-2: #475569;
      --text-3: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --accent-border: #bfdbfe;
      --green: #059669;
      --green-soft: #ecfdf5;
      --green-border: #a7f3d0;
      --amber: #b45309;
      --amber-soft: #fffbeb;
      --amber-border: #fde68a;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --red-border: #fecaca;
      --purple: #6d28d9;
      --purple-soft: #f5f3ff;
      --purple-border: #ddd6fe;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --radius: 8px;
      --radius-sm: 6px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 16px 40px rgba(15, 23, 42, 0.14);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      font-family: var(--sans); font-size: 13px; line-height: 1.5;
      color: var(--text); background: var(--bg); overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    code, pre { font-family: var(--mono); }

    .flex { display: flex; }
    .flex-col { display: flex; flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .flex-wrap { flex-wrap: wrap; }
    .flex-1 { flex: 1; min-width: 0; min-height: 0; }
    .shrink-0 { flex-shrink: 0; }
    .gap-1 { gap: 4px; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .p-2 { padding: 8px; }
    .p-3 { padding: 12px; }
    .p-4 { padding: 16px; }
    .px-3 { padding-left: 12px; padding-right: 12px; }
    .px-4 { padding-left: 16px; padding-right: 16px; }
    .py-2 { padding-top: 8px; padding-bottom: 8px; }
    .mt-1 { margin-top: 4px; }
    .mt-2 { margin-top: 8px; }
    .mb-1 { margin-bottom: 4px; }
    .mb-2 { margin-bottom: 8px; }
    .w-full { width: 100%; }
    .scroll-y { overflow-y: auto; }
    .scroll-x { overflow-x: auto; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    .text-xs { font-size: 11px; }
    .text-sm { font-size: 12px; }
    .text-base { font-size: 13px; }
    .text-lg { font-size: 15px; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .font-mono { font-family: var(--mono); }
    .text-muted { color: var(--text-2); }
    .text-subtle { color: var(--text-3); }
    .text-green { color: var(--green); }
    .text-red { color: var(--red); }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 500;
      border: 1px solid var(--border); background: var(--surface-3); color: var(--text-2); white-space: nowrap;
    }
    .badge.blue { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
    .badge.green { background: var(--green-soft); color: var(--green); border-color: var(--green-border); }
    .badge.amber { background: var(--amber-soft); color: var(--amber); border-color: var(--amber-border); }
    .badge.red { background: var(--red-soft); color: var(--red); border-color: var(--red-border); }
    .badge.purple { background: var(--purple-soft); color: var(--purple); border-color: var(--purple-border); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 5px 10px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong); background: var(--surface);
      font-size: 12px; font-weight: 500; white-space: nowrap; transition: all 0.12s;
    }
    .btn:hover { background: var(--surface-3); }
    .btn.primary { background: var(--text); border-color: var(--text); color: #fff; }
    .btn.primary:hover { background: #1e293b; }
    .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.accent:hover { background: var(--accent-hover); }
    .btn.sm { padding: 4px 9px; font-size: 11.5px; }
    .btn.xs { padding: 2px 7px; font-size: 11px; }
    .btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
    .btn.ghost:hover { background: var(--surface-3); color: var(--text); }
    .btn.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
    .btn.success-active { background: var(--green-soft); border-color: var(--green-border); color: var(--green); }
    .btn.danger-active { background: var(--red-soft); border-color: var(--red-border); color: var(--red); }

    .seg-tabs { display: inline-flex; background: var(--surface-3); padding: 2px; border-radius: 7px; gap: 2px; }
    .seg-tab { border: none; background: transparent; padding: 4px 10px; border-radius: 5px; font-size: 12px; font-weight: 500; color: var(--text-2); }
    .seg-tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); font-weight: 600; }

    .input, .select, .textarea {
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--surface); padding: 5px 8px; font-size: 12px; outline: none;
    }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,0.1);
    }
    .textarea { resize: vertical; font-family: var(--mono); line-height: 1.55; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
    .card-header { padding: 9px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th {
      background: var(--surface-2); color: var(--text-2); font-weight: 500; font-size: 11.5px;
      padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; z-index: 1;
    }
    td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr.clickable:hover td { background: #f8fafc; cursor: pointer; }
    tr.selected td { background: var(--accent-soft); }

    .json-pre {
      margin: 0; padding: 10px 12px; border-radius: var(--radius-sm);
      background: #f8fafc; border: 1px solid var(--border);
      font-family: var(--mono); font-size: 11.5px; line-height: 1.55;
      white-space: pre-wrap; word-break: break-word; overflow-x: auto;
    }
    .json-pre.trans { background: #f8fbff; border-color: var(--accent-border); }
    .json-pre.diff-old { background: #fffafa; border-color: var(--red-border); }
    .json-pre.diff-new { background: #f9fffb; border-color: var(--green-border); }
    .jk { color: #334155; font-weight: 600; }
    .js { color: #0369a1; }
    .jn { color: #7c3aed; }
    .jb { color: #b45309; }
    .jnull { color: #94a3b8; font-style: italic; }

    .msg-bubble { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); overflow: hidden; }
    .msg-role { padding: 4px 10px; font-size: 11px; font-weight: 600; background: var(--surface-3); color: var(--text-2); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    .msg-role.history { background: var(--purple-soft); color: var(--purple); }
    .msg-body { padding: 8px 10px; font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-word; }

    .collapse-box { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
    .collapse-head { padding: 7px 10px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--text-2); user-select: none; }
    .collapse-head:hover { background: var(--surface-2); color: var(--text); }
    .collapse-body { padding: 10px; border-top: 1px solid var(--border); }

    /* Shell */
    .proto-strip { height: 26px; background: #0f172a; color: #94a3b8; font-size: 11px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .proto-strip strong { color: #f8fafc; }
    .app-shell { display: flex; height: calc(100vh - 26px); width: 100%; }
    .icon-rail { width: 56px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 6px; flex-shrink: 0; }
    .rail-logo { width: 30px; height: 30px; border-radius: 7px; background: var(--text); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; margin-bottom: 10px; }
    .rail-btn { width: 44px; padding: 7px 2px; border-radius: 7px; border: none; background: transparent; color: var(--text-3); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; }
    .rail-btn:hover { background: var(--surface-3); color: var(--text); }
    .rail-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .rail-btn span.ico { font-size: 15px; line-height: 1; }

    .main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 48px; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }

    /* Workbench: Top Horizontal Step Bar + Left Prompt / Right (Top History + Bottom Detail) */
    .step-bar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0;
    }
    .step-pill {
      padding: 5px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2);
      display: inline-flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer;
    }
    .step-pill:hover { border-color: var(--border-strong); }
    .step-pill.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    .wb-split { flex: 1; display: grid; grid-template-columns: 44% 56%; min-height: 0; overflow: hidden; }
    .wb-left { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
    .wb-right { display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
    .wb-right-top { height: 37%; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
    .wb-right-bottom { height: 63%; display: flex; flex-direction: column; min-height: 0; }

    /* Overlays */
    .popover-wrap { position: relative; }
    .popover { position: absolute; top: calc(100% + 6px); right: 0; width: 320px; z-index: 3000; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 12px; }
    .backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.38); z-index: 5000; display: flex; justify-content: flex-end; }
    .backdrop.center { justify-content: center; align-items: center; padding: 20px; }
    .drawer { width: min(640px, 92vw); height: 100%; background: var(--surface); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
    .modal { width: min(980px, 95vw); max-height: 90vh; background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; }
    .toast { position: fixed; bottom: 18px; right: 18px; z-index: 9999; background: var(--text); color: #fff; padding: 9px 14px; border-radius: 8px; font-size: 12px; box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // =========================================================================
    // 1. STATE (List-First Architecture across Data, Workbench, Compare)
    // =========================================================================
    const ERROR_TAGS = [
      '幻觉/事实错误', '遗漏关键信息', '格式/Schema异常',
      '占位符损坏', '翻译腔/语序生硬', '术语/风格不符', '指令未遵循'
    ];

    const UPLOAD_PRESETS = {
      excel: {
        fileName: 'amazon_de_oct.xlsx', fileType: 'excel', size: '18.4 MB',
        sheets: ['Sheet1 (德语商品主表)', 'Sheet2 (备用类目)'], selectedSheet: 'Sheet1 (德语商品主表)',
        headerRow: 1, mergeFill: true, jsonPath: '',
        columns: [
          { col: 'sku_col', role: 'comparison_key', isJson: false, unpack: false, checked: false, samples: ['SKU-8801', 'SKU-8819', 'SKU-8904'] },
          { col: 'raw_payload', role: 'input', isJson: true, unpack: true, checked: false, samples: ['{"product_title":"Ergonomic Standing Desk",...}', '```json\n{"product_title":\'Noise Cancelling Headphones\',...\n```', '"{\\"product_title\\":\\"Smart Coffee Mug\\"..."'] },
          { col: 'ref_de_title', role: 'expected_output', isJson: false, unpack: false, checked: false, samples: ['Ergonomischer Stehschreibtisch', 'Kabellose Kopfhörer', 'Smarter Kaffeebecher 55°C'] },
          { col: 'category', role: 'metadata', isJson: false, unpack: false, checked: true, samples: ['Office', 'Audio', 'Home'] },
          { col: 'merchant_tier', role: 'metadata', isJson: false, unpack: false, checked: true, samples: ['A', 'S', 'B'] },
          { col: 'internal_row_hash', role: 'ignore', isJson: false, unpack: false, checked: false, samples: ['9f8a12', '3b2c01', '7d1e44'] }
        ]
      },
      csv: {
        fileName: 'support_faq_ja.csv', fileType: 'csv', size: '2.1 MB',
        sheets: [], selectedSheet: '', headerRow: 1, mergeFill: false, jsonPath: '',
        columns: [
          { col: 'faq_id', role: 'comparison_key', isJson: false, unpack: false, checked: false, samples: ['FAQ-101', 'FAQ-102', 'FAQ-103'] },
          { col: 'question', role: 'input', isJson: false, unpack: false, checked: true, samples: ['返品送料は誰が負担しますか？', '領収書の発行は可能ですか？', '配送日時を指定できますか？'] },
          { col: 'locale', role: 'input', isJson: false, unpack: false, checked: true, samples: ['ja-JP', 'ja-JP', 'ja-JP'] },

      },
      json: {
        fileName: 'api_export_cases.json', fileType: 'json', size: '4.6 MB',
        sheets: [], selectedSheet: '', headerRow: 1, mergeFill: false, jsonPath: 'data.items',
        columns: [
          { col: 'id', role: 'comparison_key', isJson: false, unpack: false, checked: false, samples: ['CASE-01', 'CASE-02', 'CASE-03'] },
          { col: 'payload', role: 'input', isJson: true, unpack: true, checked: false, samples: ['{"product_title":"4K Webcam","locale":"de-DE"}', '{"product_title":"USB-C Hub","locale":"de-DE"}', '{"product_title":"Desk Lamp","locale":"de-DE"}'] },
          { col: 'target_text', role: 'expected_output', isJson: false, unpack: false, checked: false, samples: ['4K-Webcam', 'USB-C-Hub', 'Schreibtischlampe'] }
        ]
      }
    };

    const state = {
      pillar: 'datacenter', // 'datacenter' | 'workbench' | 'compare' | 'settings'
      modal: null, // null | 'data_import_modal' | 'new_workflow_modal' | 'new_compare_modal' | 'context_bundle'
      drawer: null, // null | 'eval_rules' | 'prompt_review' | 'tuning' | 'annotation' | 'provider_form' | 'prompt_history'
      toast: null,

      // -----------------------------------------------------------------------
      // 1. DATA TAB: List -> Detail, Modal Wizard for Upload & Re-clean Versioning
      // -----------------------------------------------------------------------
      dcView: 'list', // 'list' | 'detail'
      selectedDatasetId: 'ds-1',
      selectedDatasetVersion: 'v2',
      selectedDatasetRecordIdx: 0,
      dcSearch: '',

      // Modal Wizard state (for New Upload OR Re-clean existing Dataset -> new version!)
      importModalMode: 'new', // 'new' | 'reclean'
      importTargetDatasetId: null,
      importStep: 1, // 1 | 2 | 3
      importPresetKey: 'excel',
      importDatasetName: 'amazon_de_new',
      uploadConfig: JSON.parse(JSON.stringify(UPLOAD_PRESETS.excel)),
      batchMapRole: 'input',
      dcUnpackKeys: ['product_title', 'locale', 'bullet_points', 'sku_id'],
      dcTruncateRepair: true,
      draftFilter: 'all',
      selectedDraftRowId: 'dr-2',
      draftRows: [
        {
          id: 'dr-1', rowNum: 14, sku: 'SKU-8801', status: 'valid', checked: false,
          rawCell: '{"product_title":"Ergonomic Standing Desk","locale":"de-DE","bullet_points":["Height adjustable","Dual motor"],"sku_id":"SKU-8801"}',
          parsedObj: { product_title: 'Ergonomic Standing Desk', locale: 'de-DE', bullet_points: ['Height adjustable', 'Dual motor'], sku_id: 'SKU-8801' },
          expected: 'Ergonomischer Stehschreibtisch (SKU-8801)', meta: { category: 'Office', tier: 'A' },
          diffNote: '标准合法 JSON'
        },
        {
          id: 'dr-2', rowNum: 29, sku: 'SKU-8819', status: 'repaired', checked: false,
          rawCell: '```json\n{"product_title": \'Noise Cancelling Headphones\', "locale": "de-DE", "bullet_points": ["40h battery", "ANC",], "sku_id": "SKU-8819",}\n```',

        {

          expected: 'Smarter Kaffeebecher 55°C', meta: { category: 'Home', tier: 'B' },
          diffNote: 'Level 1 递归解包转义 + Level 2 截断补全（缺 sku_id 填 null）'
        },
        {
          id: 'dr-4', rowNum: 412, sku: 'SKU-9022', status: 'failed', checked: true,
          rawCell: '{"product_title":"USB-C Hub 8-in-1", "locale": de-DE, "bullet_points": [invalid_token::, "4K HDMI"]',

          expected: 'USB-C Hub 8-in-1 4K HDMI', meta: { category: 'PC', tier: 'B' },
          diffNote: '语法严重损坏，无法自动修复，支持在线编辑或批量修补/跳过'
        },
        {
          id: 'dr-5', rowNum: 518, sku: 'SKU-9055', status: 'failed', checked: true,
          rawCell: '{"product_title":"Desk Lamp Pro", "locale": "de-DE", "bullet_points": ["Eye Care", "3 Modes",]',
          parsedObj: null,
          expected: 'Schreibtischlampe Pro (SKU-9055)', meta: { category: 'Home', tier: 'A' },
          diffNote: '尾部截断或语法异常，可批量一键修复'
        }
      ],

      datasets: [
        {
          id: 'ds-1', name: 'amazon_de_listing', updatedAt: '2026-11-16 10:15',
          versions: [
            {
              version: 'v2', createdAt: '11-16 10:15', sourceFile: 'amazon_de_oct.xlsx (Sheet1)',
              repairedCount: 18, note: 'raw_payload 单列顶层解包 · Comparison Key=sku_id',
              configSnapshot: { preset: 'excel', truncateRepair: true, unpackKeys: ['product_title', 'locale', 'bullet_points', 'sku_id'] },
              records: [
                {
                  key: 'SKU-8801', repairStatus: 'valid',
                  input: { product_title: 'Ergonomic Standing Desk', locale: 'de-DE', bullet_points: ['Height adjustable', 'Dual motor'], sku_id: 'SKU-8801' },
                  history: [{ role: 'user', content: 'Keep style concise.' }, { role: 'assistant', content: 'Got it.' }],
                  expected: 'Ergonomischer Stehschreibtisch mit Dual-Motor (SKU-8801)', metadata: { category: 'Office', tier: 'A' }
                },

    // =========================================================================
    // 2. CORE HELPERS
    // =========================================================================
    function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function mutate(fn) { fn(); render(); }
    function showToast(msg) {
      state.toast = msg;
      render();
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => { state.toast = null; render(); }, 3400);
    }

    function formatJsonHtml(obj) {
      if (obj === null || obj === undefined) return '<span class="jnull">null</span>';
      if (typeof obj === 'string') { try { return formatJsonHtml(JSON.parse(obj)); } catch (e) { return esc(obj); } }
      return esc(JSON.stringify(obj, null, 2)).replace(
        /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
        (m) => {
          let c = 'jn';
          if (/^"/.test(m)) c = /:$/.test(m) ? 'jk' : 'js';
          else if (/true|false/.test(m)) c = 'jb';
          else if (/null/.test(m)) c = 'jnull';
          return `<span class="${c}">${m}</span>`;
        }
      );
    }
    function renderJsonBlock(obj, cls = '') { return `<pre class="json-pre ${cls}">${formatJsonHtml(obj)}</pre>`; }

    function statusBadge(s) {
      if (!s) return '<span class="badge">-</span>';
      if (s === 'valid' || s === 'Pass' || s === 'completed' || s === 'Both Pass' || s === '正向提升')
        return `<span class="badge green">${esc(s)}</span>`;
      if (s === 'repaired' || s === 'Improvement')
        return `<span class="badge amber">${esc(s)}</span>`;
      if (s.includes('Fail') || s === 'failed' || s === 'Regression' || s === '有退化需关注')
        return `<span class="badge red">${esc(s)}</span>`;
      return `<span class="badge blue">${esc(s)}</span>`;
    }

    function getActiveDataset() { return state.datasets.find(d => d.id === state.selectedDatasetId) || state.datasets[0]; }
    function getActiveDatasetVersion() {
      const ds = getActiveDataset();
      return ds.versions.find(v => v.version === state.selectedDatasetVersion) || ds.versions[0];
    }
    function getActiveWorkflow() { return state.workflows.find(w => w.id === state.selectedWorkflowId) || state.workflows[0]; }
    function getActiveNode() {
      const wf = getActiveWorkflow();
      return wf.nodes.find(n => n.step_key === state.selectedNodeKey) || wf.nodes[0];
    }
    function getNodePromptContent(node) {
      const asset = state.promptAssets[node.promptName];
      if (!asset) return { systemMsg: '', userMsg: '' };
      if (node.binding === 'Draft') return asset.draft;
      return asset.versions.find(v => v.version === node.binding) || asset.draft;
    }
    function getRunById(id) { return state.runs.find(r => r.id === id) || state.runs[0]; }
    function getActiveComparison() { return state.comparisons.find(c => c.id === state.selectedComparisonId) || state.comparisons[0]; }

    function interpolateTemplate(tpl, inputObj, upstreamOutputs) {
      return tpl.replace(/\{\{([a-zA-Z0-9_.]+)\}\}/g, (_, expr) => {
        if (expr === 'prev_response') return '(第1轮助手初稿...)';
        if (expr.includes('.output')) {
          const parts = expr.split('.');
          let val = upstreamOutputs[parts[0]];
          for (let i = 2; i < parts.length; i++) if (val && typeof val === 'object') val = val[parts[i]];
          if (val === undefined) return `[待生成 ${expr}]`;
          return typeof val === 'object' ? JSON.stringify(val, null, 2) : String(val);
        }
        const v = inputObj[expr];
        return (v === null || v === undefined) ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
      });
    }

    function openImportModal(mode, datasetId) {
      state.importModalMode = mode; // 'new' | 'reclean'

        const ds = state.datasets.find(d => d.id === datasetId);
        const v = ds.versions[0];
        state.importDatasetName = ds.name;
        state.importPresetKey = v.configSnapshot ? v.configSnapshot.preset : 'excel';
        state.uploadConfig = JSON.parse(JSON.stringify(UPLOAD_PRESETS[state.importPresetKey]));
        state.dcTruncateRepair = v.configSnapshot ? v.configSnapshot.truncateRepair : true;
        state.dcUnpackKeys = v.configSnapshot ? [...v.configSnapshot.unpackKeys] : ['product_title', 'locale', 'sku_id'];
        state.importStep = 2; // Jump straight to mapping/cleaning config adjustment!
      } else {
        state.importPresetKey = 'excel';
        state.uploadConfig = JSON.parse(JSON.stringify(UPLOAD_PRESETS.excel));
        state.importDatasetName = 'new_dataset_' + (state.datasets.length + 1);

    function batchRepairDraftRows() {
      let fixed = 0;
      state.draftRows.forEach(r => {

          r.status = 'valid';
          r.parsedObj = { product_title: 'Auto Batch Fixed Item', locale: 'de-DE', bullet_points: ['Repaired'], sku_id: r.sku };
          r.diffNote = '批量一键修补并通过 JSON 校验';

      showToast(fixed ? `已批量修补 ${fixed} 条 failed 记录` : '没有需要修补的 failed 记录');
      render();
    }

      const before = state.draftRows.length;
      state.draftRows = state.draftRows.filter(r => !r.checked);

                        <td class="text-xs font-mono">${esc(ds.name)} ${esc(w.datasetVersion)}</td>
                        <td class="text-xs">${latestRun ? `<span class="badge blue">${latestRun.batchName}</span> ${latestRun.l1PassRate}%` : '-'}</td>
                        <td class="text-xs text-muted">${esc(w.updatedAt)}</td>
                        <td><button class="btn xs accent">进入工作台 →</button></td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      // Workbench Detail View:
      // Top: Horizontal Step Bar
      // Left: Selected Step's Prompt Editor
      // Top-Right: Run History (Batch, Time, Version, Mode)
      // Bottom-Right: Selected Batch Multi-Record Table OR Single Trace Detail
      const wf = getActiveWorkflow();
      const node = getActiveNode();
      const asset = state.promptAssets[node.promptName] || { draft: { systemMsg: '', userMsg: '' }, versions: [] };
      const { systemMsg, userMsg } = getNodePromptContent(node);
      const wfRuns = state.runs.filter(r => r.workflowId === wf.id);
      const activeRun = wfRuns.find(r => r.id === wf.selectedRunId) || wfRuns[0];
      const activeTrace = activeRun ? (activeRun.traces.find(t => t.recordKey === wf.selectedRecordKey) || activeRun.traces[0]) : null;
      const ds = state.datasets.find(d => d.id === wf.datasetId) || state.datasets[0];
      const dsVer = ds.versions.find(v => v.version === wf.datasetVersion) || ds.versions[0];

      let inputObj = activeTrace ? activeTrace.inputObj : (dsVer.records[0] ? dsVer.records[0].input : {});
      if (state.wbSingleInputMode === 'adhoc') {
        try { inputObj = JSON.parse(state.wbAdhocJson); } catch (e) { inputObj = { error: e.message }; }
      }
      const upstreamOutputs = { step_1: activeTrace ? activeTrace.step1OutObj : {} };
      const renderedSystem = interpolateTemplate(systemMsg, inputObj, upstreamOutputs);
      const renderedUser = interpolateTemplate(userMsg, inputObj, upstreamOutputs);

      return `
        <div class="flex-1 flex flex-col" style="min-height:0;">
          <!-- TOP: Horizontal Step Bar (NO left step sidebar!) -->
          <div class="step-bar flex-wrap">
            <div class="flex items-center gap-2 flex-wrap">
              <button class="btn sm" onclick="mutate(()=>state.wbView='list')">← 任务列表</button>
              <strong class="text-base">${esc(wf.name)}</strong>
              <span class="text-subtle">|</span>
              <div class="flex items-center gap-1">
                ${wf.nodes.map((n, idx) => `
                  ${idx > 0 ? '<span class="text-subtle">→</span>' : ''}
                  <div class="step-pill ${n.step_key===node.step_key?'active':''}" onclick="mutate(()=>state.selectedNodeKey='${n.step_key}')">
                    <span class="font-mono text-xs">${n.step_key}</span>
                    <span>${esc(n.name)}</span>
                    <span class="badge ${n.binding==='Draft'?'amber':'blue'}" style="font-size:10px;">${n.binding}</span>
                  </div>
                `).join('')}
                <button class="btn xs" onclick="addNewStepToWorkflow()">+ 新增步骤</button>
              </div>
            </div>

            <div class="flex items-center gap-2 popover-wrap">
              <select class="select" onchange="mutate(()=>wf.datasetVersion=this.value)">
                ${ds.versions.map(v => `<option value="${v.version}" ${v.version===wf.datasetVersion?'selected':''}>${ds.name} ${v.version}</option>`).join('')}
              </select>
              <button class="btn sm ${state.showRunOptsPopover?'active':''}" onclick="mutate(()=>state.showRunOptsPopover=!state.showRunOptsPopover)">缓存选项 ▾</button>
              <button class="btn sm" onclick="triggerRunInWorkbench(true)">▶ 跑单条</button>
              <button class="btn sm primary" onclick="triggerRunInWorkbench(false)">▶ 发起批量 Run</button>
              ${state.showRunOptsPopover ? `
                <div class="popover flex flex-col gap-2 text-xs">
                  <div class="font-semibold">运行模式与双轨缓存复用</div>
                  <select class="select w-full" onchange="mutate(()=>state.runMode=this.value)">
                    <option value="subset" ${state.runMode==='subset'?'selected':''}>前 20 条子集</option>
                    <option value="full" ${state.runMode==='full'?'selected':''}>全量批量</option>
                  </select>
                  <label class="flex items-center gap-2"><input type="checkbox" ${state.cacheEnabled?'checked':''} onchange="mutate(()=>state.cacheEnabled=this.checked)" /> 启用上游确定性缓存</label>
                </div>
              ` : ''}
            </div>
          </div>

          <!-- MAIN SPLIT: Left Prompt Editor | Right (Top: Run Batch History + Bottom: Concrete Result Detail) -->
          <div class="wb-split">
            <!-- LEFT: Selected Step Prompt Content & Config -->
            <div class="wb-left">
              <div class="px-4 py-2 flex items-center justify-between flex-wrap gap-2" style="border-bottom:1px solid var(--border); background:var(--surface-2);">
                <div class="flex items-center gap-2">
                  <span class="badge blue font-mono">${node.step_key}</span>
                  <strong>${esc(node.promptName)}</strong>
                  <select class="select" onchange="mutate(()=>{node.binding=this.value; showToast('已切换 '+node.step_key+' 绑定至 '+this.value);})">
                    <option value="Draft" ${node.binding==='Draft'?'selected':''}>Draft (实时)</option>
                    ${asset.versions.map(v => `<option value="${v.version}" ${v.version===node.binding?'selected':''}>🔒 ${v.version}</option>`).join('')}
                  </select>
                  <select class="select" onchange="mutate(()=>{const p=state.providers.find(x=>x.id===this.value); node.providerId=p.id; node.model=p.model; showToast('切换模型为 '+p.model);})">
                    ${state.providers.map(p => `<option value="${p.id}" ${p.id===node.providerId?'selected':''}>${p.model}</option>`).join('')}
                  </select>
                </div>
                <div class="flex items-center gap-1">
                  <button class="btn xs" onclick="mutate(()=>state.drawer='prompt_history')">历史版本</button>
                  <button class="btn xs" onclick="mutate(()=>state.drawer='prompt_review')">Review</button>
                  <button class="btn xs primary" onclick="mutate(()=>{ const v='v'+(asset.versions.length+1); asset.versions.unshift({version:v,createdAt:'刚刚',note:'工作台发布',systemMsg:asset.draft.systemMsg,userMsg:asset.draft.userMsg}); node.binding=v; showToast('已发布 '+v); })">发布新版</button>
                </div>
              </div>

              <div class="p-4 scroll-y flex-1 flex flex-col gap-3">
                <div>
                  <div class="text-xs font-medium text-muted mb-1">System Prompt 模板</div>
                  <textarea class="textarea w-full" rows="4" oninput="updateNodePromptField('systemMsg', this.value)">${esc(systemMsg)}</textarea>
                </div>
                <div>
                  <div class="text-xs font-medium text-muted mb-1">User 模板（支持 {{变量}} 与 {{step_key.output}}）</div>
                  <textarea class="textarea w-full" rows="5" oninput="updateNodePromptField('userMsg', this.value)">${esc(userMsg)}</textarea>
                </div>

                <div class="collapse-box">
                  <div class="collapse-head" onclick="mutate(()=>state.collapseMultiturn=!state.collapseMultiturn)">
                    <span>单步多轮配置 (${node.hasHistorySlot?'history + ':''}${1+node.turns.length} 轮)</span>
                    <span>${state.collapseMultiturn?'展开 ▾':'收起 ▴'}</span>
                  </div>
                  ${!state.collapseMultiturn ? `
                    <div class="collapse-body flex flex-col gap-2 text-xs">
                      <label><input type="checkbox" ${node.hasHistorySlot?'checked':''} onchange="mutate(()=>getActiveNode().hasHistorySlot=this.checked)" /> 注入静态 history 插槽</label>
                      ${node.turns.map(t => `<textarea class="textarea w-full" rows="2">${esc(t)}</textarea>`).join('')}
                      <button class="btn xs" onclick="mutate(()=>getActiveNode().turns.push('追问轮：基于 {{prev_response}} 检查术语。'))">+ 追加追问轮</button>
                    </div>
                  ` : ''}
                </div>

                <div class="collapse-box">
                  <div class="collapse-head" onclick="mutate(()=>state.collapseSchema=!state.collapseSchema)">
                    <span>输出格式与 Schema (${node.outputMode})</span>
                    <span>${state.collapseSchema?'展开 ▾':'收起 ▴'}</span>
                  </div>
                  ${!state.collapseSchema ? `<div class="collapse-body">${renderJsonBlock(node.schemaDef)}</div>` : ''}
                </div>
              </div>
            </div>

            <!-- RIGHT: Top = Run Batch History | Bottom = Selected Batch / Sample Concrete Detail -->
            <div class="wb-right">
              <!-- TOP-RIGHT: Run History (Batch, Timestamp, Version, Mode, Pass Rate) -->
              <div class="wb-right-top">
                <div class="px-3 py-2 flex items-center justify-between" style="background:var(--surface-2); border-bottom:1px solid var(--border);">
                  <span class="font-semibold text-sm">跑样本历史（批次 · 时间 · 版本）</span>
                  <span class="text-xs text-muted">点击批次在下方查看具体详情</span>
                </div>
                <div class="scroll-y flex-1">
                  <table>
                    <thead><tr><th>批次</th><th>时间</th><th>版本 / 模型快照</th><th>模式</th><th>通过率</th><th>费用</th></tr></thead>
                    <tbody>
                      ${wfRuns.map(r => `
                        <tr class="clickable ${activeRun && r.id===activeRun.id?'selected':''}" onclick="mutate(()=>{wf.selectedRunId='${r.id}'; if(r.traces.length) wf.selectedRecordKey=r.traces[0].recordKey;})">
                          <td class="font-medium">${esc(r.batchName)}</td>
                          <td class="text-xs text-muted">${esc(r.createdAt)}</td>
                          <td class="text-xs font-mono">${esc(r.versionSummary)}</td>
                          <td class="text-xs">${esc(r.mode)}</td>
                          <td><span class="badge ${r.l1PassRate>=70?'green':'amber'}">${r.l1PassRate}%</span></td>
                          <td class="text-xs font-mono">\$${r.bizCost.toFixed(4)}</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- BOTTOM-RIGHT: Concrete Details of Selected Batch / Sample -->
              <div class="wb-right-bottom">
                <div class="px-3 py-2 flex items-center justify-between flex-wrap gap-2" style="background:var(--surface-2); border-bottom:1px solid var(--border);">
                  <div class="flex items-center gap-2">
                    <strong class="text-sm">${activeRun ? esc(activeRun.batchName) : '无批次'} 详情</strong>
                    <div class="seg-tabs">
                      <button class="seg-tab ${state.wbDetailViewMode==='single'?'active':''}" onclick="mutate(()=>state.wbDetailViewMode='single')">单条完整细节</button>
                      <button class="seg-tab ${state.wbDetailViewMode==='batch_table'?'active':''}" onclick="mutate(()=>state.wbDetailViewMode='batch_table')">本批次全样本 (${activeRun ? activeRun.traces.length : 0}条)</button>
                    </div>
                  </div>
                  ${activeRun && state.wbDetailViewMode==='single' ? `
                    <select class="select" onchange="mutate(()=>wf.selectedRecordKey=this.value)">
                      ${activeRun.traces.map(t => `<option value="${t.recordKey}" ${activeTrace && t.recordKey===activeTrace.recordKey?'selected':''}>${t.recordKey} · ${t.effective}</option>`).join('')}
                    </select>
                  ` : ''}
                </div>

                ${!activeRun ? '<div class="p-4 text-muted">暂无运行批次</div>' : (
                  state.wbDetailViewMode === 'batch_table' ? `
                    <div class="scroll-y flex-1">
                      <table>
                        <thead><tr><th>样本 Key</th><th>格式化输出预览</th><th>规则判定</th><th>人工</th><th>耗时</th></tr></thead>
                        <tbody>
                          ${activeRun.traces.map(t => `
                            <tr class="clickable ${activeTrace && t.recordKey===activeTrace.recordKey?'selected':''}" onclick="mutate(()=>{wf.selectedRecordKey='${t.recordKey}'; state.wbDetailViewMode='single';})">
                              <td class="font-mono font-medium">${esc(t.recordKey)}</td>
                              <td class="text-xs">${renderJsonBlock(t.outputObj)}</td>
                              <td>${statusBadge(t.layer1)} ${t.repaired?'<span class="badge amber">repaired</span>':''}</td>
                              <td>${t.human ? statusBadge(t.human) : '-'}</td>
                              <td class="font-mono text-xs">${t.latencyMs}ms</td>
                            </tr>
                          `).join('')}
                        </tbody>
                      </table>
                    </div>
                  ` : `
                    <div class="p-3 scroll-y flex-1 flex flex-col gap-3">
                      <!-- Rendered Raw Messages Sent to Model -->
                      <div>
                        <div class="flex items-center justify-between mb-1">
                          <span class="text-xs font-semibold">① 发送给模型的原始内容（已插值 ${esc(activeTrace ? activeTrace.recordKey : '')}）</span>
                          <button class="btn xs ${state.translatedBlocks.input?'active':''}" onclick="mutate(()=>state.translatedBlocks.input=!state.translatedBlocks.input)">🇨🇳 译输入</button>
                        </div>
                        <div class="flex flex-col gap-1">
                          <div class="msg-bubble"><div class="msg-role"><span>SYSTEM</span><span>${node.step_key}</span></div><div class="msg-body">${esc(renderedSystem)}</div></div>
                          <div class="msg-bubble"><div class="msg-role"><span>USER</span></div><div class="msg-body">${esc(renderedUser)}</div></div>
                          ${state.translatedBlocks.input && activeTrace && activeTrace.zhTrans ? renderJsonBlock(activeTrace.zhTrans.input, 'trans') : ''}
                        </div>
                      </div>

                      ${node.step_key !== 'step_1' && activeTrace && activeTrace.step1OutObj ? `
                        <div>
                          <div class="flex items-center justify-between mb-1">
                            <span class="text-xs font-semibold">② 上游 step_1 产物（格式化 JSON）</span>
                            <button class="btn xs ${state.translatedBlocks.step_1?'active':''}" onclick="mutate(()=>state.translatedBlocks.step_1=!state.translatedBlocks.step_1)">🇨🇳 译 step_1</button>
                          </div>
                          <div class="${state.translatedBlocks.step_1?'grid-2':''}">
                            ${renderJsonBlock(activeTrace.step1OutObj)}
                            ${state.translatedBlocks.step_1 && activeTrace.zhTrans ? renderJsonBlock(activeTrace.zhTrans.step1, 'trans') : ''}
                          </div>
                        </div>
                      ` : ''}

                      <div>
                        <div class="flex items-center justify-between mb-1">
                          <span class="text-xs font-semibold">③ 最终输出（格式化 JSON）</span>
                          <div class="flex gap-1">
                            <button class="btn xs ${state.translatedBlocks.final?'active':''}" onclick="mutate(()=>state.translatedBlocks.final=!state.translatedBlocks.final)">🇨🇳 译输出</button>
                            <button class="btn xs" onclick="mutate(()=>state.drawer='annotation')">人工标注</button>
                          </div>
                        </div>
                        <div class="${state.translatedBlocks.final?'grid-2':''}">
                          ${renderJsonBlock(activeTrace ? activeTrace.outputObj : {})}
                          ${state.translatedBlocks.final && activeTrace && activeTrace.zhTrans ? renderJsonBlock(activeTrace.zhTrans.output, 'trans') : ''}
                        </div>
                      </div>
                    </div>
                  `
                )}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 5. COMPARE TAB (List of Different Comparison Needs -> Detail)
    // =========================================================================
    function createNewComparison() {
      const f = state.newCompareForm;
      const wf = state.workflows.find(w => w.id === f.workflowId) || state.workflows[0];
      const baseR = getRunById(f.baseRunId);
      const candR = getRunById(f.candRunId);
      const newId = 'cmp-' + (state.comparisons.length + 1);
      state.comparisons.unshift({
        id: newId,
        title: f.title.trim() || `${wf.name}：${baseR.batchName} vs ${candR.batchName}`,
        workflowId: wf.id, workflowName: wf.name,
        baselineRunId: baseR.id, candidateRunId: candR.id,
        createdAt: '刚刚',
        deltaText: `Layer1 ${baseR.l1PassRate}% → ${candR.l1PassRate}%`,
        status: candR.l1PassRate >= baseR.l1PassRate ? '正向提升' : '有退化需关注'
      });
      state.selectedComparisonId = newId;
      state.modal = null;
      state.cmpView = 'detail';
      showToast('已创建新对比分析任务');
      render();
    }

    function renderCompareTab() {
      if (state.cmpView === 'list') {
        return `
          <div class="p-4 flex-1 scroll-y flex flex-col gap-3">
            <div class="flex items-center justify-between">
              <div>
                <strong class="text-lg">对比评估任务列表 (Comparisons)</strong>
                <div class="text-xs text-muted">按不同调优需求与工作流管理对比记录（例如：换模型对比、改写 Prompt 对比、多轮约束对比）；点击查看配置 Diff 与逐条结果。</div>
              </div>
              <button class="btn sm primary" onclick="mutate(()=>{state.modal='new_compare_modal';})">+ 新建对比</button>
            </div>

            <div class="card">
              <table>
                <thead><tr><th>对比需求标题</th><th>所属工作流</th><th>Baseline vs Candidate</th><th>效果摘要</th><th>结论</th><th>操作</th></tr></thead>
                <tbody>
                  ${state.comparisons.map(c => {
                    const br = getRunById(c.baselineRunId);
                    const cr = getRunById(c.candidateRunId);
                    return `
                      <tr class="clickable" onclick="mutate(()=>{state.selectedComparisonId='${c.id}'; state.cmpView='detail';})">
                        <td><strong>${esc(c.title)}</strong><div class="text-xs text-subtle">${c.createdAt}</div></td>
                        <td class="text-xs">${esc(c.workflowName)}</td>
                        <td class="text-xs font-mono">${esc(br.batchName)} vs ${esc(cr.batchName)}</td>
                        <td class="text-xs">${esc(c.deltaText)}</td>
                        <td>${statusBadge(c.status)}</td>
                        <td><button class="btn xs accent">查看 Diff 报告 →</button></td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      const cmp = getActiveComparison();
      const baseRun = getRunById(cmp.baselineRunId);
      const candRun = getRunById(cmp.candidateRunId);
      const allKeys = [...new Set([...baseRun.traces.map(t=>t.recordKey), ...candRun.traces.map(t=>t.recordKey)])];
      const rows = allKeys.map(k => {
        const bt = baseRun.traces.find(t => t.recordKey === k);
        const ct = candRun.traces.find(t => t.recordKey === k);
        const bEff = bt ? bt.effective : 'Missing';
        const cEff = ct ? ct.effective : 'Missing';
        let transition = 'Both Pass';
        if (bEff === 'Pass' && cEff === 'Fail') transition = 'Regression';
        else if (bEff === 'Fail' && cEff === 'Pass') transition = 'Improvement';
        else if (bEff === 'Fail' && cEff === 'Fail') transition = 'Both Fail';
        return { key: k, bt, ct, transition };
      });
      rows.sort((a, b) => ({ Regression: 0, 'Both Fail': 1, Improvement: 2, 'Both Pass': 3 }[a.transition] ?? 9) - ({ Regression: 0, 'Both Fail': 1, Improvement: 2, 'Both Pass': 3 }[b.transition] ?? 9));
      const selRow = rows.find(r => r.key === state.compareSelectedKey) || rows[0];

      const stepKeys = [...new Set([...Object.keys(baseRun.nodeSnapshots), ...Object.keys(candRun.nodeSnapshots)])];
      const stepDiffs = stepKeys.map(sk => {
        const b = baseRun.nodeSnapshots[sk] || {};
        const c = candRun.nodeSnapshots[sk] || {};
        return { step_key: sk, base: b, cand: c, changed: b.model !== c.model || b.binding !== c.binding || b.systemMsg !== c.systemMsg };
      });

      return `
        <div class="p-4 flex-1 flex flex-col gap-3 scroll-y" style="min-height:0;">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div class="flex items-center gap-2">
              <button class="btn sm" onclick="mutate(()=>state.cmpView='list')">← 对比列表</button>
              <strong class="text-base">${esc(cmp.title)}</strong>
            </div>
            <div class="flex items-center gap-2">
              <button class="btn sm" onclick="mutate(()=>state.drawer='eval_rules')">评估规则 (5类)</button>
              <button class="btn sm" onclick="mutate(()=>state.drawer='tuning')">✨ AI 调优 (${state.tuningBasketIds.length})</button>
              <button class="btn sm primary" onclick="mutate(()=>state.modal='context_bundle')">📤 导出 Bundle</button>
            </div>
          </div>

          <!-- What changed + Metrics Delta -->
          <div class="grid-2">
            <div class="card p-3">
              <div class="font-semibold text-sm mb-2">① 改动了什么？（${esc(baseRun.batchName)} → ${esc(candRun.batchName)}）</div>
              <div class="flex flex-col gap-2 text-xs">
                ${stepDiffs.filter(d=>d.changed).map(d => `
                  <div class="p-2" style="background:var(--surface-2); border:1px solid var(--border); border-radius:6px;">
                    <div class="flex gap-2 mb-1"><span class="badge blue font-mono">${d.step_key}</span> <span>版本: <code>${esc(d.base.binding)}</code> → <code>${esc(d.cand.binding)}</code></span> <span>模型: <code>${esc(d.base.model)}</code> → <code>${esc(d.cand.model)}</code></span></div>
                    ${d.base.systemMsg !== d.cand.systemMsg ? `<div class="grid-2"><pre class="json-pre diff-old">- ${esc(d.base.systemMsg)}</pre><pre class="json-pre diff-new">+ ${esc(d.cand.systemMsg)}</pre></div>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="card p-3">
              <div class="font-semibold text-sm mb-2">② 整体指标与费用变化</div>
              <div class="grid-3 text-xs">
                <div class="p-2" style="background:var(--surface-2); border-radius:6px;"><div class="text-muted">Layer 1 通过率</div><div class="text-lg font-semibold">${baseRun.l1PassRate}% → ${candRun.l1PassRate}%</div></div>
                <div class="p-2" style="background:var(--surface-2); border-radius:6px;"><div class="text-muted">Layer 3 人工通过率</div><div class="text-lg font-semibold">${baseRun.humanPassRate}% → ${candRun.humanPassRate}%</div></div>
                <div class="p-2" style="background:var(--surface-2); border-radius:6px;"><div class="text-muted">三方隔离费用</div><div class="font-mono">业务 \$${candRun.bizCost.toFixed(4)}<br>翻译 \$${candRun.transCost.toFixed(4)}</div></div>
              </div>
            </div>
          </div>

          <!-- Per-record Side-by-Side Output Diff -->
          <div class="wb-split card flex-1" style="min-height:290px;">
            <div class="wb-left">
              <div class="card-header"><span class="font-semibold text-sm">③ 逐条样本迁移（Regression 置顶）</span></div>
              <div class="scroll-y flex-1">
                <table>
                  <thead><tr><th>Key</th><th>迁移</th><th>Baseline</th><th>Candidate</th></tr></thead>
                  <tbody>
                    ${rows.map(r => `
                      <tr class="clickable ${selRow && r.key===selRow.key?'selected':''}" onclick="mutate(()=>state.compareSelectedKey='${r.key}')">
                        <td class="font-mono font-medium">${esc(r.key)}</td>
                        <td>${statusBadge(r.transition)}</td>
                        <td>${r.bt ? statusBadge(r.bt.effective) : '-'}</td>
                        <td>${r.ct ? statusBadge(r.ct.effective) : '-'}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>

    function saveProviderForm() {
      const f = state.providerForm;

      if (state.editingProviderId) {
        const p = state.providers.find(x => x.id === state.editingProviderId);
        Object.assign(p, { name: f.name, vendor: f.vendor, baseUrl: f.baseUrl, model: f.model, roles: [...f.roles], concurrency: Number(f.concurrency) || 10, priceIn: f.priceIn, priceOut: f.priceOut });

        state.providers.push({
          id: 'mp-' + (state.providers.length + 1), name: f.name, vendor: f.vendor, baseUrl: f.baseUrl,
          apiKeyMasked: 'sk-new•••• (Fernet 已加密)', model: f.model, roles: [...f.roles],

                <div><div class="font-medium mb-1">模型 ID *</div><input class="input w-full font-mono" value="${esc(f.model)}" oninput="state.providerForm.model=this.value" /></div>
                <div><div class="font-medium mb-1">Base URL</div><input class="input w-full font-mono" value="${esc(f.baseUrl)}" oninput="state.providerForm.baseUrl=this.value" /></div>
                <div><div class="font-medium mb-1">API Key (Fernet 加密保存)</div><input class="input w-full font-mono" type="password" value="${esc(f.apiKey)}" oninput="state.providerForm.apiKey=this.value" /></div>
                <div class="grid-3">
                  <div><div class="font-medium mb-1">并发上限</div><input class="input w-full" type="number" value="${f.concurrency}" oninput="state.providerForm.concurrency=this.value" /></div>
                  <div><div class="font-medium mb-1">输入单价 $/1M</div><input class="input w-full" value="${esc(f.priceIn)}" oninput="state.providerForm.priceIn=this.value" /></div>
                  <div><div class="font-medium mb-1">输出单价 $/1M</div><input class="input w-full" value="${esc(f.priceOut)}" oninput="state.providerForm.priceOut=this.value" /></div>
                </div>
              </div>
              <div class="p-3 flex justify-end gap-2" style="border-top:1px solid var(--border);"><button class="btn sm primary" onclick="saveProviderForm()">保存并同步至工作台</button></div>
            </div>
          </div>
        `;
      }
      if (state.drawer === 'prompt_history') {
        const node = getActiveNode();
        const asset = state.promptAssets[node.promptName];
        return `
          <div class="backdrop" onclick="if(event.target===this)mutate(()=>state.drawer=null)">
            <div class="drawer">
              <div class="card-header"><strong>Prompt 历史版本 · ${esc(node.promptName)}</strong><button class="btn xs" onclick="mutate(()=>state.drawer=null)">关闭</button></div>
              <div class="p-4 scroll-y flex-1 flex flex-col gap-3 text-xs">
                ${asset.versions.map(v => `
                  <div class="card p-3">
                    <div class="flex justify-between mb-2"><span><span class="badge blue">${v.version}</span> ${v.createdAt} · ${esc(v.note)}</span>
                      <button class="btn xs primary" onclick="mutate(()=>{node.binding='${v.version}'; state.drawer=null;})">切绑此版本</button>
                    </div>
                    <pre class="json-pre">${esc(v.systemMsg + '\n---\n' + v.userMsg)}</pre>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }
      if (state.drawer === 'annotation' || state.drawer === 'eval_rules' || state.drawer === 'prompt_review' || state.drawer === 'tuning') {
        return `
          <div class="backdrop" onclick="if(event.target===this)mutate(()=>state.drawer=null)">
            <div class="drawer">
              <div class="card-header"><strong>${state.drawer==='annotation'?'人工标注 (Trace Annotation)':state.drawer==='eval_rules'?'Eval Suite 5类规则':state.drawer==='prompt_review'?'Prompt Review 静态体检':'AI 智能调优建议'}</strong><button class="btn xs" onclick="mutate(()=>state.drawer=null)">关闭</button></div>
              <div class="p-4 text-xs flex flex-col gap-3">
                ${state.drawer==='tuning' ? `<pre class="json-pre diff-new">+ 【AI 改写建议】1) 禁用英文缩写 ANC；2) 所有轮次保留 {{sku_id}}；3) 严格 JSON。</pre><button class="btn sm primary" onclick="mutate(()=>{state.drawer=null; showToast('已写入 Draft');})">采纳写入 Draft</button>` : '<div class="json-pre">完整表单交互已就绪，支持 Layer 1 规则、7 错因标签、Review 与独立调优闭环。</div>'}
              </div>
            </div>
          </div>
        `;
      }
      return '';
    }

    // =========================================================================
    // 7. APP SHELL
    // =========================================================================
    function render() {
      const titles = {
        datacenter: '数据中心',
        workbench: 'Prompt 与线性工作台',
        compare: '双版本对比与评估',
        settings: '系统设置与模型网关'
      };
      let body = '';
      if (state.pillar === 'datacenter') body = renderDataTab();
      else if (state.pillar === 'workbench') body = renderWorkbenchTab();
      else if (state.pillar === 'compare') body = renderCompareTab();
      else body = renderSettingsTab();

      document.getElementById('app').innerHTML = `
        <div class="proto-strip">
          <span><strong>PromptDone MVP V2 · 列表→详情统一架构高保真原型</strong></span>
          <span>数据列表(+弹窗批量映射/修补/变动发新版) · 工作台列表(顶部步骤条+左Prompt+右上批次历史+右下细节) · 对比需求列表</span>
        </div>
        <div class="app-shell">
          <aside class="icon-rail">
            <div class="rail-logo">PD</div>
            <button class="rail-btn ${state.pillar==='datacenter'?'active':''}" onclick="mutate(()=>state.pillar='datacenter')"><span class="ico">🗄️</span><span>数据</span></button>
            <button class="rail-btn ${state.pillar==='workbench'?'active':''}" onclick="mutate(()=>state.pillar='workbench')"><span class="ico">⚡</span><span>工作台</span></button>
            <button class="rail-btn ${state.pillar==='compare'?'active':''}" onclick="mutate(()=>state.pillar='compare')"><span class="ico">📊</span><span>对比</span></button>
            <button class="rail-btn ${state.pillar==='settings'?'active':''}" onclick="mutate(()=>state.pillar='settings')"><span class="ico">⚙️</span><span>设置</span></button>
          </aside>
          <main class="main-area">
            <header class="topbar">
              <div class="flex items-center gap-3">
                <strong class="text-base">${titles[state.pillar]}</strong>
                <span class="badge">Workspace: 默认工作区</span>
              </div>
              <div class="flex items-center gap-2">
                <button class="btn sm" onclick="mutate(()=>state.drawer='tuning')">✨ AI 调优 (${state.tuningBasketIds.length})</button>
                <button class="btn sm" onclick="mutate(()=>state.modal='context_bundle')">📤 Context Bundle</button>
              </div>
            </header>
            ${body}
          </main>
        </div>
        ${renderModalsAndDrawers()}
        ${state.toast ? `<div class="toast"><span>✓</span><span>${esc(state.toast)}</span></div>` : ''}
      `;
    }

    render();
  </script>
</body>
</html>
